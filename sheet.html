<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>锡数据日报 · 可导出</title>
<style id="sheetcss">
  :root{--red:#C00000;--blue:#1F4E79;--ink:#1a1a1a;--grey:#555;--faint:#777;--line:#D9D9D9;--bg:#fff;--soft:#FDF6F6;--thbg:#F2F2F2;--leadbg:#EEF3FA}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:"KaiTi","STKaiti","Kaiti SC","TW-Kai","AR PL KaitiM GB","Noto Serif CJK SC",serif;color:var(--ink)}
  .ctrl{max-width:1460px;margin:0 auto;padding:10px 14px;display:flex;gap:10px;align-items:center;background:var(--bg);color:var(--grey);font-size:13.5px;border-bottom:2px solid var(--red)}
  .ctrl b{color:var(--ink);font-size:15px;letter-spacing:1px}
  .ctrl button{background:var(--red);color:#fff;border:0;border-radius:4px;padding:7px 18px;font-size:13.5px;cursor:pointer;font-weight:700;font-family:inherit}
  .ctrl button.sec{background:var(--blue)}
  .ctrl .hint{color:var(--faint);font-size:12px}
  .ctrl select{font-family:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:4px;color:var(--ink);background:#fff}
  #sheet{max-width:1460px;margin:0 auto 30px;background:#fff;padding:0 0 14px}
  .shead-bar{background:#fff;color:var(--ink);text-align:left;padding:18px 0 12px;position:relative;border-bottom:2px solid var(--red)}
  .shead-bar .author{position:absolute;top:18px;right:16px;font-size:12.5px;letter-spacing:2px;color:var(--red);font-weight:700;border:1px solid var(--red);border-radius:4px;padding:2px 10px}
  .shead-bar h1{font-size:30px;letter-spacing:5px;font-weight:800;border-left:6px solid var(--red);padding-left:14px;line-height:1.3}
  .shead-bar .sub{font-size:12.5px;color:var(--faint);margin-top:4px;letter-spacing:2px;padding-left:20px}
  .main{display:flex;gap:0;align-items:stretch}
  .ttable{flex:1;min-width:0;padding:8px 6px 0 6px}
  table{border-collapse:collapse;width:100%;table-layout:fixed}
  th,td{border:1px solid var(--line);font-size:13px;padding:4px 5px;text-align:right;white-space:nowrap;overflow:hidden;color:var(--ink)}
  th{background:var(--thbg);font-weight:700;text-align:center}
  td.lb,th.lb{text-align:left;font-weight:600}
  tr.grp td{font-weight:800;text-align:left;font-size:13px;letter-spacing:.5px;background:var(--leadbg)}
  td.neg{color:var(--red)}
  td.dimv{color:#9aa0a8}
  td.newv{color:var(--red);font-weight:800;background:var(--soft)}
  .notes{width:248px;padding:8px 6px 0;display:flex;flex-direction:column;gap:6px}
  .note{border:1px solid var(--line);font-size:12px;line-height:1.55;padding:6px 8px;background:#fff;color:var(--ink)}
  .note b{display:block;margin-bottom:2px}
  .note.g{background:var(--leadbg)}.note.b{background:#E4EEF9}.note.y{background:#F7F7F7}.note.r{background:var(--soft)}
  .summary{margin:10px 6px 0;background:var(--red);color:#fff;padding:12px 16px;font-size:14px;line-height:1.75}
  .summary h2{font-size:15.5px;letter-spacing:3px;margin-bottom:6px;color:#fff}
  .sumhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .sumactions{display:flex;align-items:center;gap:9px}
  #summaryRefreshStatus{font-size:11.5px;color:#FFE1E1;letter-spacing:0;white-space:nowrap}
  #summaryRefresh{border:1px solid rgba(255,255,255,.75);border-radius:4px;background:#fff;color:var(--red);padding:3px 12px;font:700 12px/1.5 "Microsoft YaHei",sans-serif;cursor:pointer;white-space:nowrap}
  #summaryRefresh:disabled{cursor:wait;opacity:.7}
  .summary [contenteditable]{outline:none;display:block}
  .summary [contenteditable]:focus{background:rgba(255,255,255,.08)}
  .sumblk{margin-top:8px;display:flex;gap:10px;align-items:flex-start}
  .sumblk>b{flex:0 0 auto;background:#8A0000;color:#fff;padding:2px 10px;border-radius:3px;font-size:13px;letter-spacing:2px;margin-top:1px}
  .sumblk>div{flex:1;min-width:0}
  #sumA,#sumB{white-space:pre-line}
  #sumD b{color:#ffd966!important}
  #wswrap{max-width:1460px;margin:0 auto 40px;background:#fff;padding:0 0 14px}
  .wshead{background:#fff;color:var(--ink);font-size:17px;font-weight:700;padding:9px 14px;letter-spacing:2px;border-left:5px solid var(--red);border-bottom:1px solid var(--line);margin-top:10px}
  .wshead span{font-size:11.5px;color:var(--faint);font-weight:400;letter-spacing:0;margin-left:8px}
  .wsbar{display:flex;gap:8px;padding:10px;align-items:center;flex-wrap:wrap;background:var(--leadbg);border-bottom:1px solid var(--line)}
  .wsbar select{padding:6px 8px;font-size:13px;max-width:330px;font-family:inherit;border:1px solid var(--line);border-radius:4px;color:var(--ink);background:#fff}
  .wsbar button{background:var(--blue);color:#fff;border:0;border-radius:4px;padding:7px 16px;font-size:13px;cursor:pointer;font-weight:700;font-family:inherit}
  #wsgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 6px 0}
  #wsgrid:empty{padding:0;display:none}
  #wswrap:has(#wsgrid:empty){padding-bottom:0;margin-bottom:0}
  /* 无图表时整个工作区收成一条标题（点击展开操作条） */
  #wswrap:has(#wsgrid:empty) .wsbar{display:none}
  #wswrap:has(#wsgrid:empty) .wshead{cursor:pointer;user-select:none}
  #wswrap:has(#wsgrid:empty) .wshead::after{content:" ▸ 点击展开添加图表";font-size:11px;color:var(--faint);font-weight:400;letter-spacing:0;margin-left:8px}
  #wswrap.wsopen:has(#wsgrid:empty) .wsbar{display:flex}
  #wswrap.wsopen:has(#wsgrid:empty) .wshead::after{content:""}
  .wsbox .ct{position:relative;padding-right:20px}
  .wsx{position:absolute;right:7px;top:4px;cursor:pointer;color:var(--red);font-weight:800;font-size:13px}
  .charts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 6px 0}
  .cbox{border:none}
  .cbox .ct{background:var(--leadbg);font-size:13px;font-weight:700;color:var(--ink);padding:5px 8px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
  .cbox .ct span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cty{flex:0 0 auto;width:64px;padding:1px 2px;font-size:10.5px;font-family:inherit;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--blue);font-weight:400}
  .cbox .cc{height:215px;padding:4px}
  .catcol{width:74px;text-align:center!important;font-weight:800;letter-spacing:0;font-size:13px;vertical-align:middle}
  .sfoot{padding:8px 10px 0;font-size:11.5px;color:var(--faint);line-height:1.6}
</style>
<link rel="stylesheet" href="daily_strategy.css?v=202610271745">
</head>
<body>
<div class="ctrl">
  <b>锡数据日报</b>
  <button onclick="location.href='daily_input.html'">每日填报</button>
  <button onclick="TIN_SHEET.exportPNG()">导出图片 PNG</button>
  <button onclick="location.href='strategy.html'">供需策略</button>
  <button class="sec" onclick="TIN_SHEET.exportCSV()">导出表格 CSV</button>
  <a class="archive-link" href="daily_archive.html">日报留档</a>
  <select id="days" onchange="TIN_SHEET.render(this.value)">
    <option value="7">近 7 个交易日</option>
    <option value="5">近 5 个交易日</option>
    <option value="10">近 10 个交易日</option>
  </select>
  <span class="hint">日内总结可点击编辑；供需表和两种策略已移至独立“供需策略”页面</span>
</div>
<div id="sheet">
  <div class="shead-bar"><span class="author">中哲金属 · 甘思雨</span><h1>锡数据日报</h1><div class="sub" id="ssub">TIN DAILY DATA SHEET · <span id="pageVer" style="letter-spacing:0">版本检测中…</span></div></div>
  <script>
  /* 页面版本戳：读自己文件的 Last-Modified（部署时间），便于分辨新旧缓存 */
  (function(){
    var el=document.getElementById('pageVer'); if(!el) return;
    fetch(location.pathname,{method:'HEAD',cache:'no-cache'}).then(function(r){
      var p=r.headers.get('Last-Modified'); if(!p) return;
      var t=new Date(p).getTime()+8*3600000, d=new Date(t);
      var z=function(n){return (n<10?'0':'')+n;};
      el.textContent='页面构建 '+(d.getUTCMonth()+1)+'/'+d.getUTCDate()+' '+z(d.getUTCHours())+':'+z(d.getUTCMinutes())+'（北京）';
    }).catch(function(){el.textContent='';});
  })();
  </script>
  <div class="summary"><div class="sumhead"><h2>日 内 总 结</h2><div class="sumactions"><span id="summaryRefreshStatus" aria-live="polite"></span><button type="button" id="summaryRefresh" title="重新读取数据管线已生成的最新日报文件">刷新红字</button></div></div>
    <div class="sumblk"><b>宏　观</b><div contenteditable="true" id="sumA"></div></div>
    <div class="sumblk"><b>基本面</b><div contenteditable="true" id="sumB"></div></div>
    <div class="sumblk"><b>情　绪</b><div contenteditable="true" id="sumC"></div></div>
    <div class="sumblk"><b>策　略</b><div contenteditable="true" id="sumD"></div></div>
  </div>
  <div class="main">
    <div class="ttable"><table id="dtable"></table></div>
  </div>
  <div class="charts" id="charts"></div>
  <div class="sfoot" id="sfoot"></div>
</div>
<div id="wswrap">
  <div class="wshead">灵活图表工作区<span>自选指标 / 自选类型 · 不进导出图片，仅供自己分析</span></div>
  <div class="wsbar">
    <select id="ws1"></select>
    <select id="ws2"></select>
    <select id="wstype"><option value="line">折线</option><option value="bar">柱状</option><option value="season">季节（近6年）</option></select>
    <select id="wsrange"><option value="0">全部</option><option value="3">近3年</option><option value="1">近1年</option></select>
    <button onclick="TIN_SHEET.wsAdd()">＋ 添加图表</button>
  </div>
  <div id="wsgrid"></div>
</div>
<script src="lib/chart.min.js"></script>
<script src="db_data.js?v=202610302110"></script>
<script src="summary_note.js?v=202610302110"></script>
<script src="tech.js?v=202610301226"></script>
<script src="sheet.js?v=202610301226"></script>
<script src="sheet_customs.js?v=202610301226"></script>
<script src="daily_overrides.js?v=202610302110"></script>
<script src="daily_strategy.js?v=202610302110"></script>
<script>
/* 日报顶部保留四段简短结论；切换天数或刷新数据后仍保持简洁。 */
(function(){
  function applySimpleSummary(){
    var n=window.TIN_SUMMARY_NOTE||{};
    [['sumA','A'],['sumB','B'],['sumC','C'],['sumD','D']].forEach(function(x){
      var el=document.getElementById(x[0]);
      if(el&&n[x[1]]&&el.textContent!==n[x[1]])el.textContent=n[x[1]];
    });
  }
  window.TIN_SIMPLE_SUMMARY=applySimpleSummary;
  applySimpleSummary();
  if(window.TIN_SHEET&&typeof window.TIN_SHEET.render==='function'){
    var render=window.TIN_SHEET.render;
    window.TIN_SHEET.render=function(){var out=render.apply(this,arguments);applySimpleSummary();return out;};
  }
})();
</script>
<script>
/* 手动绕过缓存，重读数据管线已生成的日报文件；失败时保留当前页面内容。 */
(function(){
  var button=document.getElementById('summaryRefresh'),status=document.getElementById('summaryRefreshStatus');
  if(!button)return;
  function loadFresh(name){
    return new Promise(function(resolve,reject){
      var script=document.createElement('script'),url=name+(name.indexOf('?')<0?'?':'&')+'_refresh='+Date.now();
      script.src=url;script.async=false;
      script.onload=function(){script.remove();resolve();};
      script.onerror=function(){script.remove();reject(new Error(name));};
      document.head.appendChild(script);
    });
  }
  button.addEventListener('click',async function(){
    button.disabled=true;button.textContent='读取中…';status.textContent='正在读取数据管线';
    try{
      await loadFresh('db_data.js');
      await loadFresh('summary_note.js');
      await loadFresh('daily_overrides.js');
      if(window.TIN_SHEET&&typeof window.TIN_SHEET.render==='function'){
        var days=document.getElementById('days');window.TIN_SHEET.render(days?days.value:7);
      }
      if(window.TIN_SIMPLE_SUMMARY)window.TIN_SIMPLE_SUMMARY();
      var now=new Date(),z=function(n){return (n<10?'0':'')+n;};
      status.textContent='已更新 '+z(now.getHours())+':'+z(now.getMinutes());
      button.textContent='已刷新';
    }catch(e){
      status.textContent='读取失败，内容未清空，请稍后重试';button.textContent='重新刷新';
    }finally{
      button.disabled=false;
      setTimeout(function(){button.textContent='刷新红字';},2200);
    }
  });
})();
</script>
<script>
/* 无图表时工作区收成一条，点击标题展开操作条；有图表后操作条常显 */
(function(){
  var w=document.getElementById('wswrap'),h=w&&w.querySelector('.wshead');
  if(!h)return;
  h.addEventListener('click',function(){
    var grid=document.getElementById('wsgrid');
    if(grid&&grid.children.length===0)w.classList.toggle('wsopen');
  });
})();
</script>
</body>
</html>
