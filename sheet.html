<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>锡数据日报 · 可导出</title>
<style id="sheetcss">
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e9ebee;font-family:"KaiTi","STKaiti","Kaiti SC","TW-Kai","AR PL KaitiM GB","Noto Serif CJK SC",serif;color:#1a1a1a}
  .ctrl{max-width:1460px;margin:0 auto;padding:10px 14px;display:flex;gap:10px;align-items:center;background:#14161b;color:#cfd4dc;font-size:13px}
  .ctrl b{color:#fff;font-size:14px}
  .ctrl button{background:#c00000;color:#fff;border:0;border-radius:4px;padding:7px 18px;font-size:13.5px;cursor:pointer;font-weight:700}
  .ctrl button.sec{background:#1f4e79}
  .ctrl .hint{color:#8a919c;font-size:12px}
  #sheet{max-width:1460px;margin:0 auto 30px;background:#fff;padding:0 0 14px}
  .shead-bar{background:#1f3864;color:#fff;text-align:center;padding:10px 0 8px}
  .shead-bar h1{font-size:26px;letter-spacing:6px;font-weight:800}
  .shead-bar .sub{font-size:12.5px;opacity:.85;margin-top:3px;letter-spacing:1px}
  .main{display:flex;gap:0;align-items:stretch}
  .ttable{flex:1;min-width:0;padding:6px 6px 0 6px}
  table{border-collapse:collapse;width:100%;table-layout:fixed}
  th,td{border:1px solid #8e8e8e;font-size:12.5px;padding:4px 5px;text-align:right;white-space:nowrap;overflow:hidden}
  th{background:#dbe4f0;font-weight:700;text-align:center}
  td.lb,th.lb{text-align:left;font-weight:600}
  tr.grp td{font-weight:800;text-align:left;font-size:12.5px;letter-spacing:.5px}
  td.neg{color:#c00000}
  td.dimv{color:#9aa0a8}
  td.newv{color:#c00000;font-weight:800;background:#fdeeee}
  .notes{width:248px;padding:6px 6px 0;display:flex;flex-direction:column;gap:6px}
  .note{border:1px solid #999;font-size:11.5px;line-height:1.55;padding:6px 8px;background:#f7f7f7}
  .note b{display:block;margin-bottom:2px}
  .note.g{background:#e8eef7}.note.b{background:#dde7f3}.note.y{background:#f0f2f5}.note.r{background:#fce4e4}
  .summary{margin:8px 6px 0;background:#c00000;color:#fff;padding:12px 16px;font-size:13.5px;line-height:1.75}
  .summary h2{font-size:15px;letter-spacing:3px;margin-bottom:6px;color:#fff}
  .summary [contenteditable]{outline:none;display:block}
  .summary [contenteditable]:focus{background:rgba(255,255,255,.08)}
  .sumblk{margin-top:8px;display:flex;gap:10px;align-items:flex-start}
  .sumblk>b{flex:0 0 auto;background:rgba(0,0,0,.28);padding:2px 10px;border-radius:3px;font-size:13px;letter-spacing:2px;margin-top:1px}
  .sumblk>div{flex:1;min-width:0}
  #wswrap{max-width:1460px;margin:0 auto 40px;background:#fff;padding:0 0 14px}
  .wshead{background:#14161b;color:#fff;font-size:15px;font-weight:700;padding:9px 14px;letter-spacing:2px}
  .wshead span{font-size:11px;color:#9aa0a8;font-weight:400;letter-spacing:0;margin-left:8px}
  .wsbar{display:flex;gap:8px;padding:10px;align-items:center;flex-wrap:wrap;background:#eef0f3;border-bottom:1px solid #c9cdd4}
  .wsbar select{padding:6px 8px;font-size:12.5px;max-width:330px;font-family:inherit}
  .wsbar button{background:#1f4e79;color:#fff;border:0;border-radius:4px;padding:7px 16px;font-size:13px;cursor:pointer;font-weight:700;font-family:inherit}
  #wsgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 6px 0}
  #wsgrid:empty{padding:0}
  .wsbox .ct{position:relative;padding-right:20px}
  .wsx{position:absolute;right:7px;top:4px;cursor:pointer;color:#c00000;font-weight:800;font-size:13px}
  .charts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 6px 0}
  .cbox{border:1px solid #8e8e8e}
  .cbox .ct{background:#dbe4f0;font-size:12.5px;font-weight:700;padding:4px 8px;border-bottom:1px solid #8e8e8e;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
  .cbox .ct span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cty{flex:0 0 auto;width:64px;padding:1px 2px;font-size:10.5px;font-family:inherit;border:1px solid #8ea3bd;border-radius:3px;background:#fff;color:#1f4e79;font-weight:400}
  .cbox .cc{height:215px;padding:4px}
  .catcol{width:56px;text-align:center!important;font-weight:800;letter-spacing:1px;font-size:12.5px;vertical-align:middle}
  .sfoot{padding:8px 10px 0;font-size:11px;color:#777;line-height:1.6}
</style>
</head>
<body>
<div class="ctrl">
  <b>锡数据日报</b>
  <button onclick="TIN_SHEET.exportPNG()">导出图片 PNG</button>
  <button class="sec" onclick="TIN_SHEET.exportCSV()">导出表格 CSV</button>
  <select id="days" onchange="TIN_SHEET.render(this.value)">
    <option value="7">近 7 个交易日</option>
    <option value="5">近 5 个交易日</option>
    <option value="10">近 10 个交易日</option>
  </select>
  <span class="hint">日内总结可直接点击编辑，改完再导出；数据随 db_data.js 自动更新</span>
</div>
<div id="sheet">
  <div class="shead-bar"><h1>锡数据日报</h1><div class="sub" id="ssub">TIN DAILY DATA SHEET</div></div>
  <div class="summary"><h2>日 内 总 结</h2>
    <div class="sumblk"><b>宏　观</b><div contenteditable="true" id="sumA"></div></div>
    <div class="sumblk"><b>基本面</b><div contenteditable="true" id="sumB"></div></div>
    <div class="sumblk"><b>情　绪</b><div contenteditable="true" id="sumC"></div></div>
    <div class="sumblk"><b>技术面·策略</b><div contenteditable="true" id="sumD"></div></div>
  </div>
  <div class="main">
    <div class="ttable"><table id="dtable"></table></div>
  </div>
  <div class="charts" id="charts"></div>
  <div class="sfoot" id="sfoot"></div>
</div>
<div id="wswrap">
  <div class="wshead">灵活图表工作区<span>自选指标 / 自选类型 · 不进导出图片，仅供自己分析</span></div>
  <div class="wsbar">
    <select id="ws1"></select>
    <select id="ws2"></select>
    <select id="wstype"><option value="line">折线</option><option value="bar">柱状</option><option value="season">季节（近6年）</option></select>
    <select id="wsrange"><option value="0">全部</option><option value="3">近3年</option><option value="1">近1年</option></select>
    <button onclick="TIN_SHEET.wsAdd()">＋ 添加图表</button>
  </div>
  <div id="wsgrid"></div>
</div>
<script src="lib/chart.min.js"></script>
<script src="db_data.js"></script>
<script src="tech.js"></script>
<script src="sheet.js"></script>
</body>
</html>
