<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" href="data:,">
<title>锡研究工作台 · TIN RESEARCH</title>
<style>
  :root{--bg:#0d1117;--card:#141b28;--line:#262d3d;--gold:#d4a944;--txt:#d7dde8;--dim:#8a94a6;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
  .topbar{position:sticky;top:0;z-index:99;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
    padding:10px 18px;background:#0d1117ee;border-bottom:1px solid var(--line);backdrop-filter:blur(6px);}
  .seg{display:flex;gap:6px;}
  .seg button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;
    padding:7px 18px;font-size:14px;cursor:pointer;transition:all .15s;font-family:inherit;}
  .seg button:hover{border-color:var(--gold);}
  .seg button.on{background:var(--gold);border-color:var(--gold);color:#111;font-weight:600;}
  .author{font-size:14px;color:var(--gold);letter-spacing:.5px;white-space:nowrap;}
  .author b{font-size:15px;}
  .author span{color:var(--dim);font-size:12px;margin-left:8px;letter-spacing:2px;}
  iframe{display:block;width:100%;height:calc(100vh - 53px);border:0;background:var(--bg);}
  .wm{position:fixed;right:14px;bottom:8px;z-index:999;font-size:11px;color:rgba(138,148,166,.4);letter-spacing:.5px;pointer-events:none;}
  iframe[hidden]{display:none;}
  @media (max-width:640px){
    .topbar{padding:8px 10px;gap:7px;}
    .seg{flex:1 0 100%;min-width:0;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;}
    .seg::-webkit-scrollbar{display:none;}
    .seg button{flex:0 0 auto;padding:8px 10px;font-size:12.5px;border-radius:6px;white-space:nowrap;}
    .author{font-size:12px;width:100%;text-align:left;white-space:normal;line-height:1.5;}
    .author span{margin-left:5px;letter-spacing:1px;}
    iframe{height:calc(100vh - 102px);}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="seg" id="seg">
    <button data-v="daily">日报</button>
    <button data-v="sheet">数据日报</button>
    <button data-v="strategy">供需策略</button>
    <button data-v="dailyarchive">日报留档</button>
    <button data-v="weekly">周报·版本一</button>
    <button data-v="weekly2" class="on">周报·版本二</button>
    <button data-v="archive">周报留档</button>
    <button data-v="news">锡市场信息和情绪</button>
    <button data-v="metals">其他有色</button>
    <button data-v="db">数据库</button>
    <button data-v="bal">平衡表</button>
    <button data-v="cu">铜研究</button>
    <button data-v="cudb">铜数据库</button>
    <button data-v="lab">图表工作区</button>
  </div>
  <div class="author">锡研究工作台 · <b>TIN RESEARCH</b><span>SN · 有色</span><span style="color:#d4a944;border:1px solid #d4a944;border-radius:4px;padding:1px 8px;margin-left:10px;font-size:11px">日报10/28 · 破止损线·离场警报</span></div>
</div>
<iframe id="f-daily" data-lazy="daily_2026-10-18.html" title="锡研究日报" hidden></iframe>
<iframe id="f-sheet" data-lazy="sheet.html" title="锡数据日报" hidden></iframe>
<iframe id="f-strategy" data-lazy="strategy.html" title="锡产业供需与策略" hidden></iframe>
<iframe id="f-dailyarchive" data-lazy="daily_archive.html" title="日报留档" hidden></iframe>
<iframe id="f-weekly" data-lazy="weekly_2026-W40.html" title="锡研究周报·版本一" hidden></iframe>
<iframe id="f-weekly2" src="weekly_full.html" title="锡研究周报·版本二"></iframe>
<iframe id="f-archive" data-lazy="weekly_archive.html" title="周报留档" hidden></iframe>
<iframe id="f-news" data-lazy="news.html" title="锡产业新闻" hidden></iframe>
<iframe id="f-metals" data-lazy="metals.html" title="其他有色" hidden></iframe>
<iframe id="f-db" data-lazy="db.html" title="数据库" hidden></iframe>
<iframe id="f-bal" data-lazy="balance.html" title="平衡表" hidden></iframe>
<iframe id="f-cu" data-lazy="cu.html" title="铜研究" hidden></iframe>
<iframe id="f-cudb" data-lazy="cu_db.html" title="铜数据库" hidden></iframe>
<iframe id="f-lab" data-lazy="chart_lab.html" title="图表工作区" hidden></iframe>
<script>
(function(){
  var seg=document.getElementById('seg');
  function show(v){
    seg.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v);});
    ['daily','sheet','strategy','dailyarchive','weekly','weekly2','archive','news','metals','db','bal','cu','cudb','lab'].forEach(function(k){
      var f=document.getElementById('f-'+k); if(!f)return;
      f.hidden = (k!==v);
      if(k===v && f.dataset.lazy && !f.dataset.loaded){ f.src=f.dataset.lazy; f.dataset.loaded='1'; }
    });
  }
  seg.addEventListener('click',function(e){var b=e.target.closest('button');if(b)show(b.dataset.v);});
  var m=/[?&]v=(weekly2|daily|sheet|strategy|dailyarchive|weekly|archive|news|metals|db|bal|cu|cudb|lab)(?:&|$)/.exec(location.search);
  if(m) show(m[1]);
})();
</script>
<div class="wm">锡研究工作台 · 甘思雨 原创研究 · 未经授权禁止转载</div>
<script src="protect.js"></script>
</body>
</html>
