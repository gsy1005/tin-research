name: 日报一键更新
on:
  workflow_dispatch:
    inputs:
      date:
        description: '日期 YYYY-MM-DD（默认今天，一般留空）'
        required: false
      trx:
        description: '今日下游成交（吨）★必填'
        required: true
      trt:
        description: '今日同业成交（吨）★必填'
        required: true
      px:
        description: '价格：开 高 低 收 量（空格分隔）或只填收盘价；留空=自动抓取'
        required: false
      opt:
        description: '可选：长江现货 LME3M LME库存 升贴水三档（空格分隔，可留空）'
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 解码生成器
        run: |
          mkdir -p .gen
          echo "${{ secrets.GEN_PACK }}" | base64 -d | tar xzf - -C .gen
          if [ -f gen_cfg.b64 ]; then base64 -d gen_cfg.b64 > .gen/cfg_daily.py; fi
      - name: 运行日度更新
        env:
          IN_DATE: ${{ github.event.inputs.date }}
          IN_TRX: ${{ github.event.inputs.trx }}
          IN_TRT: ${{ github.event.inputs.trt }}
          IN_PX: ${{ github.event.inputs.px }}
          IN_OPT: ${{ github.event.inputs.opt }}
          IFIND_KEY: ${{ secrets.IFIND_KEY }}
        run: python .gen/auto_daily.py --ci
      - name: 提交并推送网站
        run: |
          base64 -w0 .gen/cfg_daily.py > gen_cfg.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js db_data.js index.html sheet.html summary_note.js gen_cfg.b64 daily_*.html
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "日报更新 ${{ github.event.inputs.date }}"
            git push
          fi
